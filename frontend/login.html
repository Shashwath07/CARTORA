<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartora - Login</title>
    <style>
        :root {
            --bg-color: #0B1120;
            --card-bg: #111827;
            --border-color: rgba(255, 255, 255, 0.06);
            --accent: #3B82F6;
            --accent-hover: #2563EB;
            --text-primary: #F9FAFB;
            --text-secondary: #9CA3AF;
            --text-tertiary: #6B7280;
            --error: #EF4444;
            --radius-card: 16px;
            --radius-btn: 10px;
            --font-main: system-ui, -apple-system, sans-serif;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 24px;
            box-sizing: border-box;
        }
        .login-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-card);
            padding: 40px 32px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .brand {
            text-align: center;
            margin-bottom: 32px;
        }
        .brand h1 {
            font-size: 32px;
            margin: 0 0 8px 0;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .brand p {
            color: var(--text-secondary);
            margin: 0;
            font-size: 15px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .form-control {
            width: 100%;
            padding: 12px 16px;
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-btn);
            color: var(--text-primary);
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.2s;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
        }
        .checkbox-group input {
            margin-right: 8px;
            accent-color: var(--accent);
        }
        .checkbox-group label {
            font-size: 14px;
            color: var(--text-secondary);
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: var(--radius-btn);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-primary:hover {
            background-color: var(--accent-hover);
        }
        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .error-message {
            color: var(--error);
            font-size: 14px;
            margin-bottom: 16px;
            text-align: center;
            display: none;
        }
        .demo-accounts {
            margin-top: 32px;
            font-size: 14px;
        }
        .demo-accounts details {
            background-color: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-btn);
            padding: 12px;
            border: 1px solid var(--border-color);
        }
        .demo-accounts summary {
            cursor: pointer;
            color: var(--text-secondary);
            font-weight: 500;
            user-select: none;
        }
        .demo-accounts .accounts-list {
            margin-top: 12px;
            color: var(--text-tertiary);
            line-height: 1.6;
        }
        .demo-accounts .account-item {
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }
        .demo-accounts .account-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        .demo-accounts strong {
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="brand">
                <h1>Cartora</h1>
                <p>Shop simply. Support that remembers.</p>
            </div>
            
            <form id="loginForm">
                <div id="errorMessage" class="error-message"></div>
                
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" class="form-control" required placeholder="name@example.com">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" required placeholder="••••••••">
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember me</label>
                </div>
                
                <button type="submit" id="submitBtn" class="btn-primary">Sign In</button>
            </form>
            
            <div class="demo-accounts">
                <details>
                    <summary>Demo Accounts</summary>
                    <div class="accounts-list">
                        <div class="account-item">
                            <strong>Maya Sharma</strong><br>
                            maya.sharma@cartora.example<br>
                            CartoraDemo#1
                        </div>
                        <div class="account-item">
                            <strong>Arjun Verma</strong><br>
                            arjun.verma@cartora.example<br>
                            CartoraDemo#2
                        </div>
                    </div>
                </details>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMessage');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';
            errorMsg.style.display = 'none';
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    window.location.href = '/app';
                } else {
                    errorMsg.textContent = data.error || 'Login failed. Please check your credentials.';
                    errorMsg.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign In';
                }
            } catch (err) {
                errorMsg.textContent = 'Network error. Please try again later.';
                errorMsg.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
